<div class="relative">
  <label *ngIf="label" class="block text-xs font-semibold text-slate-700 mb-1">{{ label }}</label>

  <div
    class="min-h-[38px] w-full flex flex-wrap items-center gap-1 px-2 py-1.5 border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500"
    [class.opacity-50]="disabled"
    [class.pointer-events-none]="disabled"
  >
    <!-- Multi-select: chips for each selected item -->
    <ng-container *ngIf="multiple">
      <span
        *ngFor="let item of selected"
        class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-xs font-medium pl-2 pr-1 py-1 rounded-md"
      >
        {{ item.label }}
        <button
          type="button"
          (click)="removeSelected(item, $event)"
          class="text-slate-400 hover:text-slate-600 rounded"
        >
          <app-icon name="x" [size]="12"></app-icon>
        </button>
      </span>
    </ng-container>

    <!-- Single-select: show the picked value as a pill when the dropdown is closed -->
    <ng-container *ngIf="!multiple && selected.length && !isOpen">
      <span class="flex items-center gap-1 text-sm text-slate-900 flex-1 py-0.5">
        {{ selected[0].label }}
        <button type="button" (click)="clearSingle($event)" class="ml-auto text-slate-400 hover:text-slate-600">
          <app-icon name="x" [size]="14"></app-icon>
        </button>
      </span>
    </ng-container>

    <input
      *ngIf="multiple || !selected.length || isOpen"
      type="text"
      [(ngModel)]="query"
      (ngModelChange)="onQueryChange($event)"
      (focus)="onFocus()"
      [placeholder]="placeholder"
      [disabled]="disabled"
      class="flex-1 min-w-[80px] text-sm outline-none border-none py-0.5 bg-transparent"
    />
  </div>

  <div
    *ngIf="isOpen"
    class="absolute z-10 mt-1 w-full max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg"
  >
    <div *ngIf="isLoading" class="px-3 py-2 text-xs text-slate-400">Searching...</div>

    <ng-container *ngIf="!isLoading">
      <button
        *ngFor="let option of options"
        type="button"
        (click)="toggleOption(option)"
        class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 flex items-center justify-between gap-2"
        [class.bg-blue-50]="isSelected(option)"
      >
        <span class="flex flex-col">
          <span class="text-slate-900">{{ option.label }}</span>
          <span *ngIf="option.sublabel" class="text-xs text-slate-400">{{ option.sublabel }}</span>
        </span>
        <app-icon *ngIf="isSelected(option)" name="check" [size]="14" class="text-blue-600"></app-icon>
      </button>

      <div *ngIf="!options.length" class="px-3 py-2 text-xs text-slate-400">
        {{ query.length < minChars ? 'Type to search...' : 'No results found' }}
      </div>
    </ng-container>
  </div>
</div>
