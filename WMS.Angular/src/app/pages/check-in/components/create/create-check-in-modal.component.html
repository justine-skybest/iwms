<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-200 pb-12">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-base font-bold font-display text-slate-900 m-0">New Check-In</h2>
      <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
        <app-icon name="x" [size]="18"></app-icon>
      </button>
    </div>

    <form (ngSubmit)="submitCreateCheckIn()" class="p-6 flex flex-col gap-4">
      <div *ngIf="createError" class="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-red-700 text-xs">
        {{ createError }}
      </div>

      <!-- Step 1: Check-In Type -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Check-In Type</label>
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            (click)="onTypeChange('Pallet')"
            [disabled]="isLocatingPallet || isLocatingBin || isSubmitting"
            class="px-3 py-2 text-sm font-semibold rounded-lg border border-slate-200 transition-colors"
            [class.bg-slate-900]="checkInType === 'Pallet'"
            [class.text-white]="checkInType === 'Pallet'"
            [class.bg-slate-50]="checkInType !== 'Pallet'"
            [class.text-slate-600]="checkInType !== 'Pallet'"
          >
            Pallet
          </button>
          <button
            type="button"
            (click)="onTypeChange('Item')"
            [disabled]="isLocatingPallet || isLocatingBin || isSubmitting"
            class="px-3 py-2 text-sm font-semibold rounded-lg border border-slate-200 transition-colors"
            [class.bg-slate-900]="checkInType === 'Item'"
            [class.text-white]="checkInType === 'Item'"
            [class.bg-slate-50]="checkInType !== 'Item'"
            [class.text-slate-600]="checkInType !== 'Item'"
          >
            Item
          </button>
        </div>
      </div>

      <!-- Step 2: Pallet Select + QR Scan -->
      <div *ngIf="checkInType === 'Pallet'" class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold text-slate-700">Pallet</label>
          <app-qr-scanner
            buttonText="Scan QR"
            modalTitle="Scan Pallet QR Code"
            (scanSuccess)="onPalletQrScanned($event)"
          ></app-qr-scanner>
        </div>

        <div class="relative">
          <app-searchable-select
            placeholder="Search pallet number..."
            [searchFn]="searchPallets"
            [selected]="selectedPallet"
            (selectedChange)="selectedPallet = $event"
          ></app-searchable-select>

          <!-- Pallet Loading Overlay -->
          <div
            *ngIf="isLocatingPallet"
            class="absolute inset-0 bg-white/80 backdrop-blur-[1px] rounded-lg flex items-center justify-center gap-2 text-xs font-medium text-blue-700 z-10 border border-blue-200 shadow-sm"
          >
            <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Locating scanned pallet...</span>
          </div>
        </div>
      </div>

      <!-- Step 2 (Alt): Product Multi-Select -->
      <app-searchable-select
        *ngIf="checkInType === 'Item'"
        label="Products"
        placeholder="Search products..."
        [multiple]="true"
        [searchFn]="searchProducts"
        [selected]="selectedProducts"
        (selectedChange)="selectedProducts = $event"
      ></app-searchable-select>

      <!-- Step 3: Check-In Date -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Check-In Date</label>
        <input
          type="date"
          [(ngModel)]="checkInDate"
          name="checkInDate"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
        />
      </div>

      <!-- Step 4: Bin Location(s) + Bin QR Scan -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold text-slate-700">Bin Location(s)</label>
          <app-qr-scanner
            buttonText="Scan Bin QR"
            modalTitle="Scan Bin QR Code"
            (scanSuccess)="onBinQrScanned($event)"
          ></app-qr-scanner>
        </div>

        <div class="relative">
          <app-searchable-select
            placeholder="Search bins..."
            [multiple]="false"
            [searchFn]="searchBins"
            [selected]="selectedBins"
            (selectedChange)="selectedBins = $event"
          ></app-searchable-select>

          <!-- Bin Loading Overlay -->
          <div
            *ngIf="isLocatingBin"
            class="absolute inset-0 bg-white/80 backdrop-blur-[1px] rounded-lg flex items-center justify-center gap-2 text-xs font-medium text-blue-700 z-10 border border-blue-200 shadow-sm"
          >
            <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Locating scanned bin...</span>
          </div>
        </div>
      </div>

      <!-- Step 5: Notes -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes</label>
        <textarea
          [(ngModel)]="notes"
          name="notes"
          rows="3"
          placeholder="Add optional notes..."
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 resize-none"
        ></textarea>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 mt-1">
        <button
          type="button"
          (click)="closeModal()"
          [disabled]="isSubmitting || isLocatingPallet || isLocatingBin"
          class="px-4 py-2 text-sm font-semibold text-slate-600 rounded-lg hover:bg-slate-100 transition-colors disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting || isLocatingPallet || isLocatingBin"
          class="px-4 py-2 bg-slate-900 text-white text-sm font-semibold rounded-lg hover:bg-slate-700 transition-colors disabled:opacity-50 flex items-center gap-2"
        >
          <span *ngIf="isSubmitting">Saving...</span>
          <span *ngIf="!isSubmitting">Save Check-In</span>
        </button>
      </div>
    </form>
  </div>
</div>
