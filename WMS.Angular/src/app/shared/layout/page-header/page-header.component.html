<header class="h-auto sm:h-[60px] bg-white border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-0 px-4 sm:px-7 -mx-4 sm:-mx-7 mb-[22px] py-3 sm:py-0 sticky top-0 z-30">
  <div>
    <h1 class="font-display font-bold text-lg text-slate-900 m-0 leading-tight">
      {{ title() }}
      @if (showWarehouse()) {
        <span class="text-slate-500 font-normal">({{ activeWarehouse().name }})</span>
      }
    </h1>
    
    @if (subtitle() || showDate()) {
      <p class="m-0 text-xs text-slate-500 mt-[1px]">
        @if (showDate()) {
          <span>{{ today | date:'MMM d, y' }}</span>
        }
        @if (showDate() && subtitle()) {
          <span> · </span>
        }
        @if (subtitle()) {
          <span>{{ subtitle() }}</span>
        }
      </p>
    }
  </div>

  <!-- Content Projection slot for action buttons, filters, or dropdowns -->
  <div class="flex items-center gap-2 self-start sm:self-auto">
    <ng-content></ng-content>
  </div>
</header>
