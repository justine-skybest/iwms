<div *ngIf="layoutService.mobileMenuOpen()" class="fixed inset-0 z-50 flex md:hidden">
  <!-- Backdrop -->
  <div 
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" 
    (click)="closeMenu()">
  </div>

  <!-- Drawer Body -->
  <div class="relative z-10 w-[228px] h-full bg-sidebar-bg shadow-2xl flex flex-col">
    <div (click)="closeMenu()" class="h-full w-full">
      <app-sidebar class="h-full block w-full"></app-sidebar>
    </div>
  </div>
</div>
