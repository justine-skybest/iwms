<aside class="w-full bg-sidebar-bg flex flex-col flex-shrink-0 h-full border-r border-sidebar-border">
  
  <!-- Logo -->
  <div class="px-5 pt-5 pb-4 border-b border-sidebar-border">
    <div class="flex items-center gap-2">
      <div class="w-7.5 h-7.5 bg-white rounded-md flex items-center justify-center">
        <img src="images/skybest.png" alt="Warehouse" class="w-4 h-4" />
      </div>
      <div>
        <div class="font-display font-bold text-[15px] text-sidebar-text-active leading-none">Skybest WMS</div>
        <div class="text-[10px] text-sidebar-text mt-0.5">v3.4.1</div>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-2.5 py-3 overflow-y-auto flex flex-col gap-1">
    
    <div class="text-[10px] font-bold text-sidebar-text uppercase tracking-widest px-2 pt-1 pb-2">
      Main Menu
    </div>
    
    <!-- Primary Operations Navigation -->
    <a (click)="closeMenu()" *ngFor="let item of mainNavItems" 
       [routerLink]="item.path" 
       routerLinkActive="active" 
       class="sidebar-link">
      <app-icon [name]="item.icon" [size]="15"></app-icon>
      <span>{{ item.label }}</span>
    </a>

    <!-- Master Data Sub-Dropdown Toggle Header -->
    <button 
      type="button" 
      (click)="toggleReports()" 
      [class.active]="isReportDataActive()"
      class="sidebar-link w-full text-left justify-between cursor-pointer border-none bg-transparent">
      <div class="flex items-center gap-2">
        <app-icon name="products" [size]="15"></app-icon>
        <span>Reports</span>
      </div>
      <svg 
        class="w-3.5 h-3.5 transition-transform duration-200 text-sidebar-text"
        [class.rotate-180]="isReportDataOpen"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

        <!-- Report Data Collapsible Child Items -->
    <div *ngIf="isReportDataOpen" class="flex flex-col gap-1 pl-3 border-l border-sidebar-border/60 ml-4 my-1">
      <a (click)="closeMenu()" *ngFor="let item of reportItems" 
         [routerLink]="item.path" 
         routerLinkActive="active" 
         class="sidebar-link text-xs">
        <lucide-icon [img]="item.icon" [size]="14"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    </div>

    <!-- Master Data Sub-Dropdown Toggle Header -->
    <button 
      type="button" 
      (click)="toggleMasterData()" 
      [class.active]="isMasterDataActive()"
      class="sidebar-link w-full text-left justify-between cursor-pointer border-none bg-transparent">
      <div class="flex items-center gap-2">
        <app-icon name="products" [size]="15"></app-icon>
        <span>Master Data</span>
      </div>
      <svg 
        class="w-3.5 h-3.5 transition-transform duration-200 text-sidebar-text"
        [class.rotate-180]="isMasterDataOpen"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Master Data Collapsible Child Items -->
    <div *ngIf="isMasterDataOpen" class="flex flex-col gap-1 pl-3 border-l border-sidebar-border/60 ml-4 my-1">
      <a (click)="closeMenu()" *ngFor="let item of masterDataItems" 
         [routerLink]="item.path" 
         routerLinkActive="active" 
         class="sidebar-link text-xs">
        <app-icon [name]="item.icon" [size]="14"></app-icon>
        <span>{{ item.label }}</span>
      </a>
    </div>

    <!-- External / App Operations -->
    <a routerLink="/mobile" target="_blank" routerLinkActive="active" class="sidebar-link mt-2">
      <app-icon name="mobile" [size]="15"></app-icon>
      <span>Mobile Operations</span>
      <span class="ml-auto text-[9px] bg-accent text-white px-1.5 py-0.5 rounded-sm font-bold">APP</span>
    </a>
  </nav>

  <!-- User Info Footer -->
  <div class="px-3.5 py-3 border-t border-sidebar-border">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 bg-sidebar-active rounded-full flex items-center justify-center shrink-0 border-2 border-accent">
        <span class="font-display font-bold text-[13px] text-accent-light">AJ</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[13px] font-semibold text-sidebar-text-active truncate">Admin User</div>
        <div class="text-[11px] text-sidebar-text truncate">admin&#64;skybest.com</div>
      </div>
      <button (click)="logout()" class="bg-transparent border-none cursor-pointer text-sidebar-text p-1 rounded hover:text-white transition-colors" title="Sign out">
        <app-icon name="logout" [size]="15"></app-icon>
      </button>
    </div>
  </div>
</aside>
