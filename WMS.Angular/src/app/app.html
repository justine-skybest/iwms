@if (hideLayout()) {
  <router-outlet />
} @else {
  <!-- Mobile Drawer -->
  <app-mobile-drawer />

  <div class="flex h-dvh flex-col overflow-hidden">
    <!-- Mobile Header -->
    <app-mobile-header />

    <div class="flex min-h-0 flex-1">
      <!-- Desktop Sidebar -->
      <div class="hidden md:block">
        <app-sidebar />
      </div>

      <div class="relative min-w-0 flex-1 overflow-y-auto">
        <div class="pb-16" [class.p-2]="layoutService.isMobile()" [class.p-4]="!layoutService.isMobile()">
          <router-outlet />
        </div>
      </div>
    </div>
  </div>

  <app-warehouse-switcher />
}
